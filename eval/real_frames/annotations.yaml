# Ground truth for docs/preregistration/2026-09-24-real-frames-2d-grounding.md
# Written BEFORE any detector/encoder ran on these frames.
# Annotator: one annotator, by eye from the 960x540 frames. Second-person check: not yet done.
# Every query class not listed as present or unsure is ABSENT on that frame.
#
# Rules fixed before annotation:
#  - table and desk are treated as synonyms: both present when any table or desk is visible.
#  - television is unsure whenever computer monitors or wall displays are visible (not a TV, but ambiguous).
#  - lamp is unsure whenever ceiling light fixtures are visible.
#  - window, door, refrigerator, potted plant, cup, laptop, backpack, bookshelf are unsure where
#    glass panels, tall cabinets, desk clutter, shopping bags or shelving make presence ambiguous.
#  - hard negatives kept as ABSENT: a blue rollator walker (not a bicycle), white humanoid robot
#    torsos (not a person), shopping bags are unsure (not asserted as backpack).
#  - person is unsure where someone may be partially visible at the frame edge.
#
# Deviation logged before inference: the robot was stationary for most of the recordings, so the
# 57 frames cover 9 distinct viewpoints (A..I). Per-frame viewpoint ids are recorded so that a
# viewpoint-cluster bootstrap can be reported next to the registered 60 s block bootstrap.
