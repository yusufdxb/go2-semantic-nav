[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/test/**/*.py" = ["E402"]
"**/tests/**/*.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = [
    "ros2_ws/src/go2_open_vocab_detector/test",
    "ros2_ws/src/go2_scene_graph/test",
    "ros2_ws/src/go2_language_grounding/test",
    "ros2_ws/src/go2_semantic_bringup/test",
    "eval",
]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
