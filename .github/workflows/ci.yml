name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: System deps
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pip \
            build-essential \
            libyaml-cpp-dev \
            ros-humble-cv-bridge \
            ros-humble-vision-msgs \
            ros-humble-tf2-ros \
            ros-humble-tf2-geometry-msgs \
            ros-humble-sensor-msgs-py \
            ros-humble-nav2-msgs \
            python3-colcon-common-extensions
          python3 -m pip install --upgrade pip
          python3 -m pip install "numpy<2.0" "scipy>=1.11" pyyaml ruff black "pytest>=7.4,<9"

      - name: Ruff lint
        run: |
          ruff check ros2_ws/src eval scripts

      - name: Colcon build (CPU fusion + scene graph, no ML dependencies)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          colcon build --packages-up-to go2_scene_graph --symlink-install \
            --cmake-args -DGO2_FUSION_ROS=ON

      - name: Unit tests (full pytest suite, config in pyproject.toml)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          python3 -m pytest -v
